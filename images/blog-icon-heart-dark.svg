<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1420" />
      <stop offset="1" stop-color="#1c1c1c" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)" />

  <!-- speech bubble -->
  <g transform="translate(400,210)">
    <rect x="-150" y="-110" width="300" height="170" rx="26" fill="#2a1420" stroke="#e8197a" stroke-width="5" />
    <path d="M -40,58 L -10,58 L -34,96 Z" fill="#2a1420" stroke="#e8197a" stroke-width="5" stroke-linejoin="round" />

    <!-- heart, beats -->
    <g transform="translate(0,-25)">
      <animateTransform attributeName="transform" type="scale" additive="sum"
        values="1;1.16;1;1.1;1" keyTimes="0;0.18;0.32;0.46;1"
        dur="2.6s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.3 0 0.4 1;0.3 0 0.4 1;0.3 0 0.4 1;0.3 0 0.4 1" />
      <path d="M 0,46 C -62,2 -62,-52 -18,-60 C 2,-64 10,-48 0,-28 C -10,-48 -2,-64 18,-60 C 62,-52 62,2 0,46 Z" fill="#d0177a" />
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#e8197a">
    <path transform="translate(580,110) scale(0.5)" d="M0,-40 C5,-11 11,-5 40,0 C11,5 5,11 0,40 C-5,11 -11,5 -40,0 C-11,-5 -5,-11 0,-40 Z">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite" />
    </path>
    <path transform="translate(230,130) scale(0.32)" d="M0,-40 C5,-11 11,-5 40,0 C11,5 5,11 0,40 C-5,11 -11,5 -40,0 C-11,-5 -5,-11 0,-40 Z">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite" />
    </path>
  </g>
</svg>

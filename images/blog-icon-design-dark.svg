<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1420" />
      <stop offset="1" stop-color="#1c1c1c" />
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8197a" />
      <stop offset="1" stop-color="#a81262" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)" />

  <!-- brush stroke, draws on -->
  <path d="M 230,290 C 300,150 420,340 540,160" fill="none" stroke="url(#stroke)"
    stroke-width="26" stroke-linecap="round" stroke-dasharray="520" stroke-dashoffset="520">
    <animate attributeName="stroke-dashoffset" values="520;0;0;520" keyTimes="0;0.55;0.85;1"
      dur="6s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.3 0 0.6 1;0 0 0 0;0.3 0 0.6 1" />
  </path>

  <!-- paintbrush -->
  <g transform="translate(540,160) rotate(-32)">
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0,0; -4,6; 0,0" keyTimes="0;0.5;1"
      dur="6s" repeatCount="indefinite" />
    <rect x="-10" y="-150" width="20" height="100" rx="8" fill="#8a8a8a" />
    <path d="M -16,-54 L 16,-54 L 6,-18 C 4,-6 -4,-6 -6,-18 Z" fill="#a81262" />
  </g>

  <!-- ruler accent -->
  <g transform="translate(560,300)" opacity="0.6">
    <rect x="0" y="0" width="150" height="24" rx="4" fill="#2a1420" stroke="#d0177a" stroke-width="3" />
    <line x1="18" y1="0" x2="18" y2="12" stroke="#d0177a" stroke-width="3" />
    <line x1="42" y1="0" x2="42" y2="12" stroke="#d0177a" stroke-width="3" />
    <line x1="66" y1="0" x2="66" y2="12" stroke="#d0177a" stroke-width="3" />
    <line x1="90" y1="0" x2="90" y2="12" stroke="#d0177a" stroke-width="3" />
    <line x1="114" y1="0" x2="114" y2="12" stroke="#d0177a" stroke-width="3" />
  </g>
</svg>

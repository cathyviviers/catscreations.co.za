<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1420" />
      <stop offset="1" stop-color="#1c1c1c" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)" />

  <!-- orbiting particles -->
  <g transform="translate(400,200)">
    <circle r="10" fill="#e8197a">
      <animateMotion dur="9s" repeatCount="indefinite"
        path="M 110,0 A 110,70 0 1 1 109.9,0 Z" rotate="auto" />
    </circle>
    <circle r="7" fill="#a81262">
      <animateMotion dur="9s" begin="-4.5s" repeatCount="indefinite"
        path="M 110,0 A 110,70 0 1 1 109.9,0 Z" rotate="auto" />
    </circle>

    <!-- main sparkle -->
    <g>
      <animateTransform attributeName="transform" type="scale" additive="sum"
        values="1;1.14;0.95;1" keyTimes="0;0.4;0.75;1"
        dur="3.4s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" />
      <path d="M0,-80 C10,-22 22,-10 80,0 C22,10 10,22 0,80 C-10,22 -22,10 -80,0 C-22,-10 -10,-22 0,-80 Z" fill="#d0177a" />
    </g>

    <!-- small secondary sparkle -->
    <g transform="translate(70,-70) scale(0.4)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.1s" repeatCount="indefinite" />
      <path d="M0,-80 C10,-22 22,-10 80,0 C22,10 10,22 0,80 C-10,22 -22,10 -80,0 C-22,-10 -10,-22 0,-80 Z" fill="#e8197a" />
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdeef6" />
      <stop offset="1" stop-color="#ffffff" />
    </linearGradient>
    <filter id="soften" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="50" />
    </filter>
    <path id="pen-path" d="M 140,540 C 420,380 620,620 900,420 C 1140,250 1300,420 1480,300" />
  </defs>
  <rect width="1600" height="700" fill="url(#bg)" />

  <g filter="url(#soften)" opacity="0.8">
    <circle cx="260" cy="200" r="220" fill="#e8197a" opacity="0.3">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 60,-30; -20,40; 0,0" keyTimes="0;0.33;0.66;1"
        dur="26s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" />
    </circle>
    <circle cx="1360" cy="520" r="250" fill="#a81262" opacity="0.28">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; -50,30; 30,-30; 0,0" keyTimes="0;0.33;0.66;1"
        dur="31s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" />
    </circle>
  </g>

  <!-- sweeping pen stroke -->
  <path d="M 140,540 C 420,380 620,620 900,420 C 1140,250 1300,420 1480,300"
    fill="none" stroke="#d0177a" stroke-width="10" stroke-linecap="round"
    stroke-dasharray="1700" stroke-dashoffset="1700" opacity="0.55">
    <animate attributeName="stroke-dashoffset" values="1700;0;0;1700" keyTimes="0;0.5;0.85;1"
      dur="14s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.3 0 0.6 1;0 0 0 0;0.3 0 0.6 1" />
  </path>

  <!-- pen nib riding the line -->
  <g opacity="0.6">
    <animateMotion dur="14s" repeatCount="indefinite" rotate="auto"
      keyPoints="0;1;1;0" keyTimes="0;0.5;0.85;1" calcMode="linear">
      <mpath href="#pen-path" />
    </animateMotion>
    <circle r="16" fill="#a81262" />
  </g>
</svg>

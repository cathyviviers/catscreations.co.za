<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1420" />
      <stop offset="1" stop-color="#1c1c1c" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)" />

  <!-- morphing mark -->
  <g transform="translate(340,200)">
    <path fill="#d0177a">
      <animate attributeName="d" dur="6s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"
        keyTimes="0;0.3;0.5;0.8;1"
        values="
          M0,-80 C44,-80 80,-44 80,0 C80,44 44,80 0,80 C-44,80 -80,44 -80,0 C-80,-44 -44,-80 0,-80 Z;
          M0,-90 L70,-40 L90,50 L0,90 L-90,50 L-70,-40 Z;
          M0,-90 L70,-40 L90,50 L0,90 L-90,50 L-70,-40 Z;
          M0,-70 C60,-70 70,-10 70,0 C70,50 30,90 0,90 C-40,90 -70,30 -70,-10 C-70,-50 -40,-70 0,-70 Z;
          M0,-80 C44,-80 80,-44 80,0 C80,44 44,80 0,80 C-44,80 -80,44 -80,0 C-80,-44 -44,-80 0,-80 Z" />
    </path>
  </g>

  <!-- swatches -->
  <g transform="translate(540,230)">
    <circle cx="0" cy="0" r="20" fill="#e8197a">
      <animateTransform attributeName="transform" type="scale" additive="sum"
        values="1;1.25;1" keyTimes="0;0.5;1" dur="2.4s" begin="0s" repeatCount="indefinite" />
    </circle>
    <circle cx="56" cy="-10" r="16" fill="#a81262">
      <animateTransform attributeName="transform" type="scale" additive="sum"
        values="1;1.25;1" keyTimes="0;0.5;1" dur="2.4s" begin="0.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="102" cy="18" r="13" fill="#f3a6c9">
      <animateTransform attributeName="transform" type="scale" additive="sum"
        values="1;1.25;1" keyTimes="0;0.5;1" dur="2.4s" begin="0.8s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>

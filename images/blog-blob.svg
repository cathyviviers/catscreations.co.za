<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5fa" />
      <stop offset="1" stop-color="#ffffff" />
    </linearGradient>
    <radialGradient id="blobPinkLight" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e8197a" stop-opacity="0.5" />
      <stop offset="0.5" stop-color="#e8197a" stop-opacity="0.22" />
      <stop offset="0.8" stop-color="#e8197a" stop-opacity="0.06" />
      <stop offset="1" stop-color="#e8197a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blobPink" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d0177a" stop-opacity="0.45" />
      <stop offset="0.5" stop-color="#d0177a" stop-opacity="0.2" />
      <stop offset="0.8" stop-color="#d0177a" stop-opacity="0.05" />
      <stop offset="1" stop-color="#d0177a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blobPinkDark" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a81262" stop-opacity="0.4" />
      <stop offset="0.5" stop-color="#a81262" stop-opacity="0.18" />
      <stop offset="0.8" stop-color="#a81262" stop-opacity="0.05" />
      <stop offset="1" stop-color="#a81262" stop-opacity="0" />
    </radialGradient>
    <filter id="soften" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="36" />
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#bg)" />

  <g filter="url(#soften)">
    <g transform="translate(180,130)">
      <circle r="170" fill="url(#blobPinkLight)">
        <animateTransform attributeName="transform" type="scale" additive="sum"
          values="1;1.08;0.94;1" keyTimes="0;0.35;0.7;1"
          dur="19s" repeatCount="indefinite" calcMode="spline"
          keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" />
      </circle>
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="0,0; 46,-24; -18,30; 0,0" keyTimes="0;0.33;0.66;1"
        dur="19s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" />
    </g>

    <g transform="translate(630,100)">
      <circle r="150" fill="url(#blobPinkDark)">
        <animateTransform attributeName="transform" type="scale" additive="sum"
          values="1;0.92;1.1;1" keyTimes="0;0.4;0.75;1"
          dur="23s" repeatCount="indefinite" calcMode="spline"
          keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" />
      </circle>
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="0,0; -38,26; 24,-20; 0,0" keyTimes="0;0.33;0.66;1"
        dur="23s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" />
    </g>

    <g transform="translate(430,300)">
      <circle r="200" fill="url(#blobPink)">
        <animateTransform attributeName="transform" type="scale" additive="sum"
          values="1;1.06;0.96;1" keyTimes="0;0.3;0.65;1"
          dur="17s" repeatCount="indefinite" calcMode="spline"
          keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" />
      </circle>
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="0,0; 30,20; -40,-14; 0,0" keyTimes="0;0.33;0.66;1"
        dur="17s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" />
    </g>

    <g transform="translate(710,330)">
      <circle r="95" fill="url(#blobPinkLight)">
        <animateTransform attributeName="transform" type="scale" additive="sum"
          values="1;1.12;0.9;1" keyTimes="0;0.4;0.7;1"
          dur="13s" repeatCount="indefinite" calcMode="spline"
          keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" />
      </circle>
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="0,0; -24,-18; 20,24; 0,0" keyTimes="0;0.33;0.66;1"
        dur="13s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" />
    </g>
  </g>
</svg>

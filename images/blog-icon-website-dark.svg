<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1420" />
      <stop offset="1" stop-color="#1c1c1c" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)" />

  <!-- browser window -->
  <g transform="translate(300,90)">
    <rect x="0" y="0" width="200" height="140" rx="12" fill="#2a1420" stroke="#d0177a" stroke-width="5" />
    <rect x="0" y="0" width="200" height="30" rx="12" fill="#3a1c2c" stroke="#d0177a" stroke-width="5" />
    <circle cx="20" cy="15" r="5" fill="#e8197a" />
    <circle cx="38" cy="15" r="5" fill="#e3c1d2" />
    <circle cx="56" cy="15" r="5" fill="#e3c1d2" />
    <rect x="20" y="52" width="160" height="14" rx="7" fill="#a81262" />
    <rect x="20" y="78" width="120" height="10" rx="5" fill="#e3c1d2" />
    <rect x="20" y="98" width="140" height="10" rx="5" fill="#e3c1d2" />
  </g>

  <!-- orbiting play icon -->
  <g>
    <animateMotion dur="8s" repeatCount="indefinite"
      path="M 400,160 A 160,90 0 1 1 399.9,160 Z" />
    <circle r="26" fill="#2a1420" stroke="#e8197a" stroke-width="5" />
    <path d="M -8,-11 L 14,0 L -8,11 Z" fill="#d0177a" />
  </g>

  <!-- orbiting heart icon -->
  <g>
    <animateMotion dur="8s" begin="-4s" repeatCount="indefinite"
      path="M 400,160 A 160,90 0 1 1 399.9,160 Z" />
    <circle r="22" fill="#2a1420" stroke="#a81262" stroke-width="5" />
    <g transform="translate(0,-3) scale(0.22)">
      <path d="M 0,50 C -25,25 -62,0 -62,-32 C -62,-56 -40,-68 -19,-62 C -6,-58 0,-50 0,-44 C 0,-50 6,-58 19,-62 C 40,-68 62,-56 62,-32 C 62,0 25,25 0,50 Z" fill="#d0177a" />
    </g>
  </g>
</svg>

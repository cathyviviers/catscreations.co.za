  <style>
    .thankyou-wrap {
      min-height: 80vh;
      display: flex;

    .thankyou-inner h1 { font-size: 2rem; margin-bottom: 12px; }
    .thankyou-inner h1 em { font-style: normal; color: var(--pink); }
    .thankyou-inner p { color: var(--text-muted); line-height: 1.7; margin-bottom: 32px; }
    .thankyou-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 48px; }
    .thankyou-social-label { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; }
    .thankyou-social { display: flex; gap: 20px; justify-content: center; }
    .thankyou-social a {
      color: var(--text-muted);
      transition: color 0.2s ease, transform 0.2s ease;
      display: flex; align-items: center;
    }
    .thankyou-social a:hover { color: var(--pink); transform: translateY(-2px); }
    .thankyou-social svg {
      width: 22px; height: 22px; fill: none;
      stroke: currentColor; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;

  <script>
    const themeToggle = document.getElementById('theme-toggle');
    const rootEl = document.documentElement;
    function setToggleIcon(theme) { themeToggle.textContent = theme === 'dark' ? '🌙' : '☀️'; }
    setToggleIcon(rootEl.getAttribute('data-theme'));
    themeToggle.addEventListener('click', () => {
      const next = rootEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      rootEl.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      setToggleIcon(next);
    });
  </script>
